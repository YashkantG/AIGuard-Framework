# Example Kubernetes deployment. Cloud-neutral: uses only core resources.
#
# Before applying:
#   1. Build and push the image, then set `image:` below.
#   2. Create the secret (do not commit real values):
#        kubectl -n aiguard create secret generic aiguard-secrets \
#          --from-literal=database-url='postgresql+psycopg://USER:PASSWORD@HOST:5432/aiguard' \
#          --from-literal=api-keys='ci:analyst:REPLACE_WITH_A_LONG_RANDOM_KEY'
#   3. Put TLS in front of the Service (Ingress or gateway of your choice).
#
# replicas is 1 on purpose: the rate limiter and the audit write lock live in
# process memory. With several replicas the database's unique constraint still
# keeps the audit chain from forking, but concurrent writers can receive errors.
apiVersion: v1
kind: Namespace
metadata:
  name: aiguard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiguard-artifacts
  namespace: aiguard
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiguard
  namespace: aiguard
  labels:
    app.kubernetes.io/name: aiguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aiguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiguard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aiguard
          image: REPLACE_WITH_YOUR_REGISTRY/aiguard:0.1.0
          args: ["aiguard", "serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AIGUARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiguard-secrets
                  key: database-url
            - name: AIGUARD_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: aiguard-secrets
                  key: api-keys
            - name: AIGUARD_ARTIFACT_DIR
              value: /data/artifacts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: artifacts
              mountPath: /data/artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: aiguard-artifacts
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiguard
  namespace: aiguard
spec:
  selector:
    app.kubernetes.io/name: aiguard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiguard-ingress
  namespace: aiguard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aiguard
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8000
