[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiguard-framework"
version = "0.1.0"
description = "Open framework for AI model governance and security"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["ai-governance", "ml-security", "model-integrity", "drift-detection", "explainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
explain = ["shap>=0.45", "scikit-learn>=1.4"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "scikit-learn>=1.4",
]

[project.scripts]
aiguard = "aiguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aiguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/aiguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
